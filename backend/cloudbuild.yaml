# Cloud Build 設定（バックエンド Hono API）。
# ローカル開発コンテナに Docker が無い環境でも `gcloud builds submit --config
# backend/cloudbuild.yaml --substitutions _IMAGE=... backend/` でビルド・プッシュできる。
#
# レイヤーキャッシュ: `docker build --cache-from` + BUILDKIT_INLINE_CACHE=1（旧実装）は
# multi-stage Dockerfile の中間ステージ（builder ステージの npm ci 層）を実際には
# キャッシュしないことを実機検証で確認した（"importing cache manifest" 自体は成功するが
# npm ci が毎回フルで再実行され、CACHED マーカーが一切出ない）。
# そのため `docker buildx build` + レジストリキャッシュエクスポーター (mode=max) に変更。
# mode=max は最終イメージだけでなく中間ステージの全レイヤーもキャッシュ対象にするため、
# package.json / package-lock.json に変更が無い日は builder/runner 両ステージの
# npm ci 層が実際に CACHED ヒットする（2回目以降のビルドで確認済み）。
# キャッシュは本体イメージとは別に `:buildcache` タグとして Artifact Registry に保存する
# （registry キャッシュエクスポーターは実イメージのタグに同居できないため）。
substitutions:
  _IMAGE: ''

steps:
  # NOTE: Cloud Build は `${VAR}` を自身の substitution 構文として解釈しようとするため、
  # bash 側のパラメータ展開（$$IMAGE / $${CACHE_REF} 等）はすべて `$$` でエスケープして
  # 「リテラルな $」として渡す必要がある（そうしないと "not a valid built-in substitution"
  # で Cloud Build 側のバリデーションに落ちる）。
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    env:
      - 'IMAGE=${_IMAGE}'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker buildx create --name cibuilder --driver docker-container --use
        docker buildx inspect --bootstrap

        CACHE_REF="$${IMAGE%:*}:buildcache"
        echo "Image: $$IMAGE"
        echo "Cache: $$CACHE_REF"

        docker buildx build \
          --cache-from "type=registry,ref=$$CACHE_REF" \
          --cache-to "type=registry,ref=$$CACHE_REF,mode=max" \
          -t "$$IMAGE" \
          --push \
          .

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
