name: Deploy Backend to Cloud Run

# バックエンド API (realestate-api) を Cloud Run にデプロイする。
#
# ビルド方式: scripts/deploy.sh と同じ「Terraform 管理のイメージタグに build & push
# してから --image でデプロイ」方式。タグは terraform/cloud_run.tf の
# local.image_url（<region>-docker.pkg.dev/<project>/realestate-api/backend:latest）と
# 一致させてあるため、後から terraform apply してもイメージが巻き戻らない。
# （gcloud run deploy --source は cloud-run-source-deploy リポジトリに別タグで
#   push するため Terraform と drift する。そのため採用していない。）
#
# 環境変数について: Cloud Run の env は Terraform (cloud_run.tf) が正。
# ここでは --set-env-vars を渡さず既存サービスの設定をそのまま引き継ぐ
# （scripts/deploy.sh はローカル .env から注入するが、CI に同じ値は無いため
#   注入すると本番の環境変数を空で上書きしてしまう）。
#
# トリガー:
# - push (main) で backend/** または本ワークフロー自身が変更されたとき
# - workflow_dispatch（手動実行）

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy_backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy API to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Resolve deployment target
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          CLOUD_RUN_SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
        run: |
          set -euo pipefail
          # secrets 未設定時は terraform/variables.tf の既定値にフォールバック
          REGION="${GCP_REGION:-asia-northeast1}"
          SERVICE="${CLOUD_RUN_SERVICE_NAME:-realestate-api}"
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/realestate-api/backend:latest"

          {
            echo "REGION=${REGION}"
            echo "SERVICE=${SERVICE}"
            echo "IMAGE=${IMAGE}"
          } >> "$GITHUB_ENV"

          echo "Project : ${GCP_PROJECT_ID}"
          echo "Region  : ${REGION}"
          echo "Service : ${SERVICE}"
          echo "Image   : ${IMAGE}"

      - name: Build & push image (Cloud Build)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # backend/cloudbuild.yaml を使う（--tag だけの素朴なビルドだと、
          # Artifact Registry の既存 :latest を --cache-from で参照する
          # レイヤーキャッシュ設定が一切適用されない）。
          # アップロード対象は backend/.gcloudignore / backend/.dockerignore で絞られる。
          gcloud builds submit backend \
            --config backend/cloudbuild.yaml \
            --substitutions "_IMAGE=${IMAGE}" \
            --project "${GCP_PROJECT_ID}" \
            --quiet

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # --set-env-vars は渡さない（環境変数は Terraform 管理・既存設定を維持）
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --platform managed \
            --quiet

      - name: Verify the new revision serves traffic
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          DESCRIBE() {
            gcloud run services describe "${SERVICE}" \
              --region "${REGION}" --project "${GCP_PROJECT_ID}" "$@"
          }

          LATEST_READY=$(DESCRIBE --format='value(status.latestReadyRevisionName)')
          TRAFFIC=$(DESCRIBE --format='value(status.traffic[0].revisionName)')
          SERVING_IMAGE=$(DESCRIBE --format='value(spec.template.spec.containers[0].image)')
          URL=$(DESCRIBE --format='value(status.url)')

          echo "Latest ready revision : ${LATEST_READY}"
          echo "Serving revision      : ${TRAFFIC}"
          echo "Serving image         : ${SERVING_IMAGE}"
          echo "Service URL           : ${URL}"

          if [ -z "${LATEST_READY}" ]; then
            echo "::error::最新リビジョンが Ready になっていません"
            exit 1
          fi

          # /health が 200 を返すまで最大2分待つ（起動直後の初回リクエスト対策）
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            echo "  [${i}] GET /health -> ${CODE}"
            if [ "${CODE}" = "200" ]; then
              echo "✅ ヘルスチェック成功: ${LATEST_READY} がトラフィックを処理しています"
              exit 0
            fi
            sleep 10
          done

          echo "::error::/health が 200 を返しませんでした（最終コード: ${CODE}）"
          exit 1
